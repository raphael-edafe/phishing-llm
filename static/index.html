<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phishing Detector</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --ink: #16191d;
    --muted: #6b7280;
    --line: #e3e6ea;
    --accent: #2563eb;
    --safe: #15803d;
    --safe-bg: #dcfce7;
    --warn: #b45309;
    --warn-bg: #fef3c7;
    --danger: #b91c1c;
    --danger-bg: #fee2e2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a20; --ink: #e8eaed; --muted: #9aa1ab;
      --line: #272b33; --accent: #60a5fa;
      --safe: #4ade80; --safe-bg: #0f2f1c;
      --warn: #fbbf24; --warn-bg: #33280a;
      --danger: #f87171; --danger-bg: #3a1414;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2rem 1rem 4rem;
    background: var(--bg); color: var(--ink);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 780px; margin: 0 auto; }
  h1 { font-size: 1.35rem; margin: 0 0 .25rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; font-size: .9rem; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 1.1rem;
  }
  textarea {
    width: 100%; min-height: 230px; resize: vertical;
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: .75rem;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: .6rem; align-items: center; margin-top: .75rem; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; cursor: pointer;
    background: var(--accent); color: #fff; border: 0;
    border-radius: 8px; padding: .6rem 1.1rem;
  }
  button:disabled { opacity: .55; cursor: default; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); font-weight: 500;
  }
  .hint { color: var(--muted); font-size: .82rem; }
  #out { margin-top: 1.25rem; }
  .hidden { display: none; }

  .verdictbar { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; }
  .badge {
    font-weight: 700; font-size: .78rem; letter-spacing: .06em;
    text-transform: uppercase; padding: .3rem .65rem; border-radius: 999px;
  }
  .badge.legitimate { background: var(--safe-bg); color: var(--safe); }
  .badge.spam       { background: var(--warn-bg); color: var(--warn); }
  .badge.phishing   { background: var(--danger-bg); color: var(--danger); }

  .score { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.5rem; }
  .meter { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; flex: 1 1 160px; min-width: 120px; }
  .meter > i { display: block; height: 100%; border-radius: 99px; transition: width .35s ease; }

  .verdict { margin: .9rem 0 0; }
  h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em;
       color: var(--muted); margin: 1.4rem 0 .5rem; }
  ul { margin: 0; padding-left: 1.1rem; }
  li { margin: .3rem 0; }
  .det { border-left: 3px solid var(--accent); padding: .55rem .8rem;
         background: color-mix(in srgb, var(--accent) 8%, transparent);
         border-radius: 0 6px 6px 0; }
  .det code { font-size: .85em; }
  .err { border-left: 3px solid var(--danger); padding: .6rem .8rem;
         background: var(--danger-bg); color: var(--danger); border-radius: 0 6px 6px 0; }
  .spin { display: inline-block; width: 13px; height: 13px; vertical-align: -2px;
          border: 2px solid currentColor; border-right-color: transparent;
          border-radius: 50%; animation: sp .7s linear infinite; margin-right: .4rem; }
  @keyframes sp { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Phishing Detector</h1>
  <p class="sub">Paste an email — headers included if you have them — and it will be checked for
     phishing indicators.</p>

  <div class="panel">
    <textarea id="email" spellcheck="false"
      placeholder="From: PayPal Security &lt;service@paypa1-secure.com&gt;&#10;Subject: URGENT: Your account has been limited&#10;&#10;Dear Valued Customer, ..."></textarea>
    <div class="row">
      <button id="go">Analyse</button>
      <button id="sample" class="ghost" type="button">Load sample</button>
      <span class="hint" id="hint">Takes about 7 seconds.</span>
    </div>
  </div>

  <div id="out"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c;
                            if (txt != null) n.textContent = txt; return n; };

const SAMPLE = `From: PayPal Security <service@paypa1-secure.com>
To: customer@example.com
Subject: URGENT: Your account has been limited

Dear Valued Customer,

We have detected unusual activity on your account. Your account access has
been LIMITED until you verify your information.

You must confirm your identity within 24 hours or your account will be
permanently suspended and your funds forfeited.

Click here to restore access: http://paypa1-secure.com/verify/login.php

Please have your password and the card number on file ready.

Sincerely,
PayPal Security Team`;

$('#sample').onclick = () => { $('#email').value = SAMPLE; $('#email').focus(); };

// colour the meter by danger, not by category - a 'spam' verdict at 0.05 and
// a 'phishing' verdict at 0.95 should not share a colour
const tone = s => s >= 0.5 ? 'danger' : s >= 0.2 ? 'warn' : 'safe';

function render(d) {
  const out = $('#out'); out.replaceChildren();
  const panel = el('div', 'panel');

  const bar = el('div', 'verdictbar');
  bar.append(el('span', 'badge ' + d.category, d.category));
  const score = el('span', 'score', d.risk_score.toFixed(2));
  score.style.color = `var(--${tone(d.risk_score)})`;
  bar.append(score);
  const meter = el('div', 'meter'), fill = el('i');
  fill.style.width = Math.max(2, d.risk_score * 100) + '%';
  fill.style.background = `var(--${tone(d.risk_score)})`;
  meter.append(fill); bar.append(meter);
  panel.append(bar);

  panel.append(el('p', 'verdict', d.verdict));

  // the deterministic layer is shown apart from the model's judgement on
  // purpose: this one is a verifiable fact about the text, not an opinion
  if (d.domain_findings?.length) {
    panel.append(el('h2', null, 'Domain check — verified, not inferred'));
    const box = el('div', 'det');
    const ul = el('ul');
    d.domain_findings.forEach(f => ul.append(el('li', null, f)));
    box.append(ul); panel.append(box);
  }

  panel.append(el('h2', null, d.flags.length ? 'Indicators' : 'Indicators — none found'));
  if (d.flags.length) {
    const ul = el('ul');
    d.flags.forEach(f => ul.append(el('li', null, f)));
    panel.append(ul);
  } else {
    panel.append(el('p', 'hint', 'The model reported no phishing indicators in this email.'));
  }

  out.append(panel);
}

function showError(msg, findings) {
  const out = $('#out'); out.replaceChildren();
  const panel = el('div', 'panel');
  panel.append(el('div', 'err', msg));
  if (findings?.length) {
    panel.append(el('h2', null, 'Domain check still ran'));
    const ul = el('ul');
    findings.forEach(f => ul.append(el('li', null, f)));
    panel.append(ul);
  }
  out.append(panel);
}

$('#go').onclick = async () => {
  const email = $('#email').value.trim();
  if (!email) { showError('Paste an email first.'); return; }

  // 7 seconds of silence reads as a hang - say something immediately
  const btn = $('#go'); btn.disabled = true;
  const hint = $('#hint'); hint.replaceChildren(el('span', 'spin'),
                                                document.createTextNode('Analysing…'));
  $('#out').replaceChildren();

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (!res.ok) showError(data.error || 'Request failed.', data.domain_findings);
    else render(data);
  } catch (e) {
    showError('Could not reach the server. Is app.py running?');
  } finally {
    btn.disabled = false;
    hint.textContent = 'Takes about 7 seconds.';
  }
};
</script>
</body>
</html>
